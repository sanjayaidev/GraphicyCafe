<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>GraphicyCafe — Product Detail</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- model-viewer handles View 3D + Simple AR natively -->
<script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>

<!-- Three.js, for Advanced AR mode -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module" src="js/webxr-ar.js"></script>

<style>
/* ─── CSS Variables ─── */
:root {
  --color-bg: #17140F;
  --color-surface: #211C15;
  --color-surface-raised: #2B2419;
  --color-ivory: #F3ECDD;
  --color-ivory-dim: #C9BFA9;
  --color-amber: #E3A63D;
  --color-amber-dim: #B9822B;
  --color-ember: #C2542A;
  --color-green: #7CB77B;
  --color-red: #D4685C;
  --color-line: rgba(243, 236, 221, 0.12);
  --color-line-strong: rgba(243, 236, 221, 0.22);

  --font-display: 'Fraunces', 'Georgia', serif;
  --font-body: 'Inter', -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', 'SFMono-Regular', monospace;

  --radius-lg: 20px;
  --radius-md: 12px;
  --radius-sm: 8px;

  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }

body {
  background: var(--color-bg);
  color: var(--color-ivory);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

img { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; }

:focus-visible {
  outline: 2px solid var(--color-amber);
  outline-offset: 2px;
}

/* ─── TOAST ─── */
.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: var(--color-amber);
  color: #211405;
  padding: 12px 20px;
  border-radius: var(--radius-sm);
  font-weight: 600;
  font-size: 14px;
  z-index: 200;
  animation: fadeInUp 0.3s ease;
}
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ─── HEADER ─── */
.site-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 24px;
  border-bottom: 1px solid var(--color-line);
  position: sticky;
  top: 0;
  background: rgba(23, 20, 15, 0.9);
  backdrop-filter: blur(8px);
  z-index: 20;
}

.back-link {
  color: var(--color-ivory);
  text-decoration: none;
  font-size: 20px;
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  border: 1px solid var(--color-line-strong);
}
.back-link:hover {
  border-color: var(--color-amber);
  color: var(--color-amber);
}

.site-mark {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 18px;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
.icon-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1px solid var(--color-line-strong);
  background: transparent;
  color: var(--color-ivory);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  position: relative;
}
.icon-btn:hover { border-color: var(--color-amber); }
.cart-count {
  position: absolute;
  top: -4px;
  right: -4px;
  background: var(--color-ember);
  color: var(--color-ivory);
  font-size: 10px;
  font-family: var(--font-mono);
  width: 18px;
  height: 18px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ─── BREADCRUMB ─── */
.breadcrumb {
  padding: 16px 24px 0;
  max-width: 1200px;
  margin: 0 auto;
  font-size: 13px;
  color: var(--color-ivory-dim);
}
.breadcrumb a { color: var(--color-ivory-dim); }
.breadcrumb a:hover { color: var(--color-amber); }
.breadcrumb .sep { margin: 0 8px; }

/* ─── PRODUCT STAGE ─── */
.product-stage {
  max-width: 1200px;
  margin: 0 auto;
  padding: 24px 24px 48px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 40px;
}

/* Viewer column */
.viewer-column {
  position: relative;
}

/* ============================================================
   Viewer
   ============================================================ */
.viewer-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  background:
    radial-gradient(120% 120% at 50% 15%, var(--color-surface-raised) 0%, var(--color-surface) 55%, var(--color-bg) 100%);
  overflow: hidden;
}

.viewer {
  width: 100%;
  height: 100%;
  --poster-color: transparent;
}

.poster-note {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--color-ivory-dim);
}

.xr-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.ar-notice {
  position: absolute;
  left: 16px;
  right: 16px;
  bottom: 16px;
  background: rgba(23, 20, 15, 0.95);
  border: 1px solid var(--color-line-strong);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  z-index: 10;
}

.ar-notice p {
  margin: 0;
  font-size: 13px;
  line-height: 1.5;
  color: var(--color-ivory);
  flex: 1;
}

.notice-close {
  flex-shrink: 0;
  background: transparent;
  border: 1px solid var(--color-line-strong);
  color: var(--color-ivory-dim);
  font-family: var(--font-mono);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding: 8px 12px;
  border-radius: 999px;
  cursor: pointer;
}

.notice-close:hover {
  border-color: var(--color-amber);
  color: var(--color-amber);
}

/* ============================================================
   Mode switch — three ticket-style tabs, numbered because the
   order genuinely reflects increasing AR complexity
   ============================================================ */
.mode-switch {
  display: flex;
  border-bottom: 1px solid var(--color-line);
}

.mode-tab {
  flex: 1;
  background: transparent;
  border: none;
  border-right: 1px solid var(--color-line);
  color: var(--color-ivory-dim);
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 500;
  padding: 16px 8px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: color 0.15s ease, background 0.15s ease;
}

.mode-tab:last-child {
  border-right: none;
}

.mode-index {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--color-ivory-dim);
  opacity: 0.6;
}

.mode-tab.is-active {
  color: var(--color-amber);
  background: rgba(227, 166, 61, 0.08);
}

.mode-tab.is-active .mode-index {
  color: var(--color-amber);
  opacity: 1;
}

.mode-tab:hover:not(.is-active) {
  color: var(--color-ivory);
}

/* ============================================================
   Advanced AR overlay (rendered on top of the camera feed
   during an active WebXR session)
   ============================================================ */
.ar-overlay {
  position: fixed;
  inset: 0;
  /* Was pointer-events: none. This element (the dom-overlay root) is the
     only thing that receives real touch events during an immersive-ar
     session — the canvas underneath does not, even though it's what you
     see. It needs pointer-events: auto so rotate/pinch/pan gestures reach
     it; the hint pill below still opts out individually. */
  pointer-events: auto;
  z-index: 50;
}

.ar-overlay-hint {
  position: absolute;
  top: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(23, 20, 15, 0.85);
  color: var(--color-ivory);
  font-size: 13px;
  line-height: 1.4;
  padding: 10px 18px;
  border-radius: 999px;
  max-width: 82vw;
  text-align: center;
  pointer-events: none;
}

.ar-overlay-controls {
  position: absolute;
  bottom: 32px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: center;
  gap: 12px;
  pointer-events: auto;
}

.ar-exit-btn {
  background: rgba(23, 20, 15, 0.85);
  color: var(--color-ivory-dim);
  border: 1px solid var(--color-line-strong);
  font-family: var(--font-mono);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding: 14px 20px;
  border-radius: 999px;
  cursor: pointer;
}

.ar-cart-btn {
  background: var(--color-amber);
  color: var(--color-bg);
  border: none;
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 14px;
  padding: 14px 26px;
  border-radius: 999px;
  cursor: pointer;
}

@media (max-width: 380px) {
  .mode-tab {
    font-size: 12px;
    padding: 14px 4px;
  }
}

/* ============================================================
   GraphicyCafe additions (not in the reference viewer)
   ============================================================ */
/* Card framing for the two-column product layout */
.viewer-wrap {
  border-radius: var(--radius-lg);
  border: 1px solid var(--color-line);
}
/* .ar-notice sets display:flex and .viewer inherits model-viewer's
   display:block, both of which override the [hidden] attribute. */
.ar-notice[hidden],
.viewer[hidden] {
  display: none;
}

/* ─── INFO COLUMN ─── */
.product-info {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.product-category {
  font-family: var(--font-mono);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--color-amber);
}

.product-name {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: clamp(28px, 4vw, 40px);
  line-height: 1.1;
  margin: 0;
  color: var(--color-ivory);
}

.product-meta {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
}
.product-meta span {
  font-size: 12px;
  color: var(--color-ivory-dim);
  background: var(--color-surface-raised);
  padding: 4px 12px;
  border-radius: 999px;
}
.product-meta .in-stock { color: var(--color-green); }
.product-meta .out-of-stock { color: var(--color-red); }
.product-meta .has-3d { color: var(--color-amber); }

.product-price {
  font-family: var(--font-mono);
  font-size: 28px;
  color: var(--color-ivory);
  padding: 8px 0;
}

.product-desc {
  font-size: 15px;
  line-height: 1.7;
  color: var(--color-ivory-dim);
  margin: 0;
}

.product-dietary {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.dietary-tag {
  font-size: 11px;
  font-family: var(--font-mono);
  color: var(--color-ivory-dim);
  background: var(--color-surface-raised);
  padding: 4px 12px;
  border-radius: 999px;
  border: 1px solid var(--color-line);
}

.product-actions {
  display: flex;
  gap: 12px;
  padding: 16px 0;
  border-top: 1px solid var(--color-line);
  border-bottom: 1px solid var(--color-line);
  flex-wrap: wrap;
}
.add-to-cart-btn {
  background: var(--color-amber);
  color: #211405;
  border: none;
  font-weight: 600;
  font-size: 15px;
  padding: 14px 32px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background 0.15s ease;
}
.add-to-cart-btn:hover { background: var(--color-amber-dim); }
.add-to-cart-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.wishlist-btn {
  background: transparent;
  border: 1px solid var(--color-line-strong);
  color: var(--color-ivory);
  font-size: 18px;
  padding: 12px 20px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: border-color 0.15s ease;
}
.wishlist-btn:hover {
  border-color: var(--color-red);
  color: var(--color-red);
}
.wishlist-btn.is-wishlisted {
  border-color: var(--color-red);
  color: var(--color-red);
}

/* ─── PRODUCT DETAIL TABS ─── */
.detail-tabs {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 24px 48px;
}
.tab-nav {
  display: flex;
  gap: 0;
  border-bottom: 1px solid var(--color-line);
}
.tab-nav button {
  background: transparent;
  border: none;
  color: var(--color-ivory-dim);
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 500;
  padding: 16px 24px;
  cursor: pointer;
  position: relative;
  transition: color 0.15s ease;
}
.tab-nav button::after {
  content: '';
  position: absolute;
  bottom: -1px;
  left: 24px;
  right: 24px;
  height: 2px;
  background: var(--color-amber);
  transform: scaleX(0);
  transition: transform 0.2s ease;
}
.tab-nav button.is-active {
  color: var(--color-ivory);
}
.tab-nav button.is-active::after {
  transform: scaleX(1);
}
.tab-nav button:hover:not(.is-active) {
  color: var(--color-ivory);
}

.tab-panel {
  display: none;
  padding: 24px 0;
}
.tab-panel.is-active {
  display: block;
}

/* ─── REVIEWS ─── */
.review-summary {
  display: flex;
  align-items: center;
  gap: 32px;
  padding: 20px;
  background: var(--color-surface);
  border-radius: var(--radius-md);
  border: 1px solid var(--color-line);
  margin-bottom: 24px;
  flex-wrap: wrap;
}
.review-rating-big {
  font-family: var(--font-display);
  font-size: 48px;
  line-height: 1;
  color: var(--color-amber);
}
.review-rating-stars {
  color: var(--color-amber);
  font-size: 18px;
  letter-spacing: 2px;
}
.review-count {
  color: var(--color-ivory-dim);
  font-size: 13px;
}
.review-breakdown {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 8px 12px;
  align-items: center;
  font-size: 13px;
}
.review-bar {
  width: 120px;
  height: 6px;
  background: var(--color-line);
  border-radius: 3px;
  overflow: hidden;
}
.review-bar-fill {
  height: 100%;
  background: var(--color-amber);
  border-radius: 3px;
}

.review-card {
  background: var(--color-surface);
  border: 1px solid var(--color-line);
  border-radius: var(--radius-md);
  padding: 20px;
  margin-bottom: 16px;
}
.review-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
  flex-wrap: wrap;
  gap: 8px;
}
.reviewer {
  display: flex;
  align-items: center;
  gap: 10px;
}
.reviewer-avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--color-amber);
  color: #211405;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 600;
  font-size: 14px;
}
.reviewer-name {
  font-weight: 600;
}
.reviewer-date {
  font-size: 12px;
  color: var(--color-ivory-dim);
}
.review-stars {
  color: var(--color-amber);
  font-size: 14px;
  letter-spacing: 1px;
}
.review-text {
  font-size: 14px;
  line-height: 1.6;
  color: var(--color-ivory-dim);
  margin: 8px 0 0;
}

.write-review-btn {
  background: transparent;
  border: 1px solid var(--color-line-strong);
  color: var(--color-ivory);
  padding: 12px 24px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  cursor: pointer;
  transition: border-color 0.15s ease;
}
.write-review-btn:hover {
  border-color: var(--color-amber);
  color: var(--color-amber);
}

/* ─── SIMILAR PRODUCTS ─── */
.similar-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 16px;
}
.similar-card {
  background: var(--color-surface);
  border: 1px solid var(--color-line);
  border-radius: var(--radius-md);
  overflow: hidden;
  transition: border-color 0.15s ease;
  cursor: pointer;
}
.similar-card:hover {
  border-color: var(--color-amber-dim);
}
.similar-card model-viewer {
  width: 100%;
  height: 150px;
  --poster-color: transparent;
  background: var(--color-bg);
}
.similar-card img {
  width: 100%;
  height: 150px;
  object-fit: cover;
}
.similar-body {
  padding: 12px 14px 14px;
}
.similar-name {
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 600;
  margin: 0 0 4px;
}
.similar-cat {
  font-size: 11px;
  color: var(--color-ivory-dim);
  font-family: var(--font-mono);
}
.similar-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 8px;
}
.similar-price {
  font-weight: 600;
}
.similar-add {
  background: var(--color-amber);
  color: #211405;
  border: none;
  font-size: 12px;
  font-weight: 600;
  padding: 6px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
}
.similar-add:hover { background: var(--color-amber-dim); }

/* ─── RESPONSIVE ─── */
@media (max-width: 860px) {
  .product-stage {
    grid-template-columns: 1fr;
    gap: 24px;
    padding: 16px;
  }
  .viewer-wrap {
    aspect-ratio: 1 / 1;
  }
  .review-summary {
    flex-direction: column;
    align-items: flex-start;
    gap: 16px;
  }
}

@media (max-width: 480px) {
  .site-header {
    padding: 12px 16px;
  }
  .mode-tab {
    font-size: 11px;
    padding: 10px 6px;
  }
  .mode-index { display: none; }
  .product-actions { flex-direction: column; }
  .add-to-cart-btn { width: 100%; justify-content: center; }
  .tab-nav button {
    font-size: 13px;
    padding: 14px 16px;
  }
  .similar-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}
</style>
<script src="demo/demo-api.js"></script>
</head>
<body>

<!-- ═══ HEADER ═══ -->
<header class="site-header">
  <a href="products.html" class="back-link" aria-label="Back to menu">&larr;</a>
  <span class="site-mark" id="siteBrand">GraphicyCafe</span>
  <div class="header-actions">
    <button class="icon-btn" aria-label="Account">◐</button>
    <button class="icon-btn" aria-label="Cart">🛒<span class="cart-count" id="cartCount">0</span></button>
  </div>
</header>

<!-- ═══ BREADCRUMB ═══ -->
<div class="breadcrumb">
  <a href="index.html">Home</a><span class="sep">/</span>
  <a href="products.html">Menu</a><span class="sep">/</span>
  <span id="breadcrumbProduct">Loading...</span>
</div>

<!-- ═══ PRODUCT STAGE ═══ -->
<div class="product-stage" id="productStage">

  <!-- Viewer Column -->
  <div class="viewer-column">
  <div class="viewer-wrap" aria-label="Product viewer">

      <model-viewer
        id="viewer"
        class="viewer"
        src=""
        alt=""
        ar
        ar-modes="webxr scene-viewer quick-look"
        camera-controls
        auto-rotate
        auto-rotate-delay="1200"
        shadow-intensity="1"
        exposure="1"
        environment-image="neutral"
        interaction-prompt="none"
        autoplay
      >
        <div class="poster-note" slot="poster">Loading model&hellip;</div>
      </model-viewer>

      <!-- Advanced AR takes over this canvas when active; hidden otherwise -->
      <canvas id="xr-canvas" class="xr-canvas" hidden></canvas>

      <div id="advancedArNotice" class="ar-notice" hidden>
        <p id="advancedArNoticeText"></p>
        <button type="button" id="advancedArNoticeClose" class="notice-close">Dismiss</button>
      </div>

      <!-- Rendered on top of the camera feed only during an active Advanced AR session -->
      <div id="arOverlay" class="ar-overlay" hidden>
        <p class="ar-overlay-hint" id="arHint"></p>
        <div class="ar-overlay-controls">
          <button type="button" id="arExitBtn" class="ar-exit-btn">Exit AR</button>
          <button type="button" id="arAddToCartBtn" class="ar-cart-btn" hidden>Add to cart</button>
        </div>
      </div>

    </div>

  <!-- Mode switch -->
    <div class="mode-switch" role="tablist" aria-label="Viewing mode">
      <button type="button" class="mode-tab is-active" id="modeView3D" role="tab" aria-selected="true">
        <span class="mode-index">01</span> View 3D
      </button>
      <button type="button" class="mode-tab" id="modeSimpleAR" role="tab" aria-selected="false">
        <span class="mode-index">02</span> Simple AR
      </button>
      <button type="button" class="mode-tab" id="modeAdvancedAR" role="tab" aria-selected="false">
        <span class="mode-index">03</span> Advanced AR
      </button>
    </div>
  </div>

  <!-- Info Column -->
  <div class="product-info" id="productInfo">
    <span class="product-category" id="productCategory">Category</span>
    <h1 class="product-name" id="productName">Product Name</h1>
    <div class="product-meta" id="productMeta">
      <span id="productStock" class="in-stock">In stock</span>
      <span id="product3dBadge" class="has-3d">◐ 3D available</span>
      <span id="productSku">SKU: —</span>
    </div>
    <div class="product-price" id="productPrice">$0.00</div>
    <p class="product-desc" id="productDesc">Product description goes here.</p>
    <div class="product-dietary" id="productDietary"></div>
    <div class="product-actions">
      <button class="add-to-cart-btn" id="addToCartBtn">Add to cart</button>
      <button class="wishlist-btn" id="wishlistBtn">♡</button>
    </div>
  </div>
</div>

<!-- ═══ DETAIL TABS ═══ -->
<div class="detail-tabs">
  <div class="tab-nav" id="tabNav">
    <button class="is-active" data-tab="description">Description</button>
    <button data-tab="reviews">Reviews</button>
    <button data-tab="similar">Similar Products</button>
  </div>

  <!-- Description Tab -->
  <div class="tab-panel is-active" id="tab-description">
    <div class="product-desc-full" id="productDescFull" style="font-size:15px;line-height:1.8;color:var(--color-ivory-dim);max-width:720px;">
      Loading description...
    </div>
  </div>

  <!-- Reviews Tab -->
  <div class="tab-panel" id="tab-reviews">
    <div id="reviewsContainer">
      <div style="color:var(--color-ivory-dim);text-align:center;padding:40px 20px;">Loading reviews...</div>
    </div>
  </div>

  <!-- Similar Products Tab -->
  <div class="tab-panel" id="tab-similar">
    <div class="similar-grid" id="similarGrid">
      <div style="grid-column:1/-1;color:var(--color-ivory-dim);text-align:center;padding:40px 20px;">Loading similar products...</div>
    </div>
  </div>
</div>

<!-- ═══ SCRIPTS ═══ -->
<script>
// ─── CONFIG ───
const API_BASE = '';
const PLACEHOLDER_GLB = 'https://modelviewer.dev/shared-assets/models/Astronaut.glb';
const PLACEHOLDER_USDZ = 'https://modelviewer.dev/shared-assets/models/Astronaut.usdz';

// ─── STATE ───
let product = null;
let allProducts = [];
let cartCount = 0;
let isWishlisted = false;
let currentProductId = null;

// ─── HELPERS ───
function showToast(msg) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}

function getImageUrl(images) {
  if (!images || images.length === 0) return 'https://picsum.photos/seed/default/400/300';
  return images[0];
}

function getInitials(name) {
  if (!name) return '?';
  return name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
}

// ─── GET PRODUCT ID FROM URL ───
function getProductIdFromUrl() {
  const params = new URLSearchParams(window.location.search);
  return params.get('id');
}

// ─── LOAD PRODUCT ───
async function loadProduct(productId) {
  try {
    const res = await fetch(`${API_BASE}/api/admin/products`, { credentials: 'include' });
    if (!res.ok) throw new Error('Failed to load products');
    allProducts = await res.json();
    
    const modelsRes = await fetch(`${API_BASE}/api/admin/models`, { credentials: 'include' });
    if (modelsRes.ok) {
      const models = await modelsRes.json();
      models.forEach(m => {
        if (m.assigned_product_id) {
          const prod = allProducts.find(p => p.id === m.assigned_product_id);
          if (prod) {
            prod.model_url = m.file_url;
            prod.model_filename = m.filename;
          }
        }
      });
    }
    
    product = allProducts.find(p => p.id === productId);
    if (!product) {
      throw new Error('Product not found');
    }
    
    currentProductId = productId;
    renderProduct();
    renderReviews();
    renderSimilarProducts();
    
  } catch (err) {
    console.error('Failed to load product:', err);
    document.getElementById('productName').textContent = 'Product not found';
    document.getElementById('productDesc').textContent = 'Sorry, we couldn\'t find this product.';
  }
}

// ─── RENDER PRODUCT ───
function renderProduct() {
  const p = product;
  
  document.getElementById('breadcrumbProduct').textContent = p.name;
  document.getElementById('productCategory').textContent = p.category_name || 'Uncategorized';
  document.getElementById('productName').textContent = p.name;
  document.getElementById('productPrice').textContent = `$${Number(p.price).toFixed(2)}`;
  document.getElementById('productDesc').textContent = p.description || 'A delicious dish from our kitchen.';
  document.getElementById('productDescFull').textContent = p.description || 'A delicious dish from our kitchen.';
  
  const stockEl = document.getElementById('productStock');
  if (p.stock_quantity > 0) {
    stockEl.textContent = `In stock (${p.stock_quantity})`;
    stockEl.className = 'in-stock';
    document.getElementById('addToCartBtn').disabled = false;
  } else {
    stockEl.textContent = 'Out of stock';
    stockEl.className = 'out-of-stock';
    document.getElementById('addToCartBtn').disabled = true;
  }
  
  const has3d = !!p.model_url;
  const badge3d = document.getElementById('product3dBadge');
  if (has3d) {
    badge3d.textContent = '◐ 3D available';
    badge3d.className = 'has-3d';
  } else {
    badge3d.textContent = 'No 3D preview';
    badge3d.className = '';
  }
  
  document.getElementById('productSku').textContent = `SKU: ${p.id ? p.id.slice(0, 8) : '—'}`;
  
  const dietaryContainer = document.getElementById('productDietary');
  const tags = p.dietary_tags || [];
  if (tags.length > 0) {
    dietaryContainer.innerHTML = tags.map(t => `<span class="dietary-tag">${t}</span>`).join('');
  } else {
    dietaryContainer.innerHTML = '';
  }
  
  // Model source comes from the product API; everything else is reference viewer logic.
  if (has3d) {
    viewer.src = p.model_url;
    viewer.alt = `3D model of ${p.name}`;
  } else {
    viewer.src = PLACEHOLDER_GLB;
    viewer.iosSrc = PLACEHOLDER_USDZ;
    viewer.alt = 'Placeholder 3D model';
  }
}

// ─── RENDER REVIEWS ───
function renderReviews() {
  const container = document.getElementById('reviewsContainer');
  
  const reviews = [
    {
      name: 'Aisha K.',
      initials: 'AK',
      date: '2024-12-15',
      rating: 5,
      text: 'Being able to see this dish in 3D before ordering sold me on it instantly. The presentation matched perfectly!'
    },
    {
      name: 'Ravi M.',
      initials: 'RM',
      date: '2024-12-10',
      rating: 5,
      text: 'The flavors were incredible and the AR preview meant zero surprises at the table. Highly recommend!'
    },
    {
      name: 'Tara L.',
      initials: 'TL',
      date: '2024-12-05',
      rating: 4,
      text: 'Beautifully presented and tasted even better than it looked in 3D. Will order again.'
    }
  ];
  
  const avgRating = reviews.reduce((sum, r) => sum + r.rating, 0) / reviews.length;
  const ratingDistribution = { 5: 0, 4: 0, 3: 0, 2: 0, 1: 0 };
  reviews.forEach(r => { ratingDistribution[r.rating] = (ratingDistribution[r.rating] || 0) + 1; });
  const maxCount = Math.max(...Object.values(ratingDistribution));
  
  container.innerHTML = `
    <div class="review-summary">
      <div>
        <div class="review-rating-big">${avgRating.toFixed(1)}</div>
        <div class="review-rating-stars">${'★'.repeat(Math.round(avgRating))}${'☆'.repeat(5 - Math.round(avgRating))}</div>
        <div class="review-count">${reviews.length} reviews</div>
      </div>
      <div class="review-breakdown">
        ${[5,4,3,2,1].map(r => `
          <span>${r}★</span>
          <div class="review-bar">
            <div class="review-bar-fill" style="width:${maxCount > 0 ? (ratingDistribution[r] / maxCount) * 100 : 0}%"></div>
          </div>
          <span>${ratingDistribution[r] || 0}</span>
        `).join('')}
      </div>
    </div>
    ${reviews.map(r => `
      <div class="review-card">
        <div class="review-header">
          <div class="reviewer">
            <div class="reviewer-avatar">${r.initials}</div>
            <div>
              <div class="reviewer-name">${r.name}</div>
              <div class="reviewer-date">${new Date(r.date).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })}</div>
            </div>
          </div>
          <div class="review-stars">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</div>
        </div>
        <p class="review-text">${r.text}</p>
      </div>
    `).join('')}
    <button class="write-review-btn" onclick="showToast('Review writing coming soon!')">Write a review</button>
  `;
}

// ─── RENDER SIMILAR PRODUCTS ───
function renderSimilarProducts() {
  const container = document.getElementById('similarGrid');
  
  const similar = allProducts
    .filter(p => p.id !== product.id && p.is_active !== false)
    .filter(p => {
      if (p.category_id === product.category_id) return true;
      const productTags = product.dietary_tags || [];
      const otherTags = p.dietary_tags || [];
      return productTags.some(t => otherTags.includes(t));
    })
    .slice(0, 6);
  
  if (similar.length === 0) {
    container.innerHTML = `
      <div style="grid-column:1/-1;color:var(--color-ivory-dim);text-align:center;padding:40px 20px;">
        No similar products found. Check back soon!
      </div>
    `;
    return;
  }
  
  container.innerHTML = similar.map(p => {
    const has3d = !!p.model_url;
    return `
      <div class="similar-card" onclick="window.location.href='product-details.html?id=${p.id}'">
        ${has3d ? `
          <model-viewer
            src="${p.model_url}"
            alt="${p.name}"
            auto-rotate
            auto-rotate-delay="2000"
            camera-controls
            disable-zoom
            shadow-intensity="1"
            exposure="1"
            environment-image="neutral"
            interaction-prompt="none"
            style="width:100%;height:150px;--poster-color:transparent;"
          ></model-viewer>
        ` : `
          <img src="${getImageUrl(p.images)}" alt="${p.name}">
        `}
        <div class="similar-body">
          <div class="similar-name">${p.name}</div>
          <div class="similar-cat">${p.category_name || 'Uncategorized'}</div>
          <div class="similar-foot">
            <span class="similar-price">$${Number(p.price).toFixed(2)}</span>
            <button class="similar-add" onclick="event.stopPropagation();addToCart('${p.id}')">+ Add</button>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

// ─── CART ───
function addToCart(productId) {
  cartCount++;
  document.getElementById('cartCount').textContent = cartCount;
  const prod = allProducts.find(p => p.id === productId);
  showToast(`${prod ? prod.name : 'Item'} added to cart!`);
}

document.getElementById('addToCartBtn').addEventListener('click', () => {
  if (product) {
    addToCart(product.id);
  }
});

// ─── WISHLIST ───
document.getElementById('wishlistBtn').addEventListener('click', function() {
  isWishlisted = !isWishlisted;
  this.classList.toggle('is-wishlisted');
  this.textContent = isWishlisted ? '♥' : '♡';
  showToast(isWishlisted ? 'Added to wishlist!' : 'Removed from wishlist');
});

// ─── TABS ───
document.querySelectorAll('.tab-nav button').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.tab-nav button').forEach(b => b.classList.remove('is-active'));
    this.classList.add('is-active');
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('is-active'));
    document.getElementById('tab-' + this.dataset.tab).classList.add('is-active');
  });
});

// ─── VIEWER + AR MODES (from 3DARViewer product page) ───
const viewer = document.getElementById('viewer');
const xrCanvas = document.getElementById('xr-canvas');

// Fallback if the product's model fails to load
viewer.addEventListener('error', (event) => {
  if (viewer.src && viewer.src !== PLACEHOLDER_GLB) {
    console.warn('Model failed to load \u2014 falling back to placeholder model.');
    viewer.src = PLACEHOLDER_GLB;
    viewer.iosSrc = PLACEHOLDER_USDZ;
  }
});

const notice = document.getElementById('advancedArNotice');
const noticeText = document.getElementById('advancedArNoticeText');
const noticeClose = document.getElementById('advancedArNoticeClose');

const tabs = {
  view3d: document.getElementById('modeView3D'),
  simpleAr: document.getElementById('modeSimpleAR'),
  advancedAr: document.getElementById('modeAdvancedAR'),
};

function setActiveTab(activeKey) {
  Object.entries(tabs).forEach(([key, el]) => {
    const isActive = key === activeKey;
    el.classList.toggle('is-active', isActive);
    el.setAttribute('aria-selected', String(isActive));
  });
}

tabs.view3d.addEventListener('click', () => {
  setActiveTab('view3d');
  notice.hidden = true;
  xrCanvas.hidden = true;
  viewer.hidden = false;
  viewer.cameraOrbit = '0deg 75deg 105%';
});

tabs.simpleAr.addEventListener('click', () => {
  setActiveTab('simpleAr');
  notice.hidden = true;
  if (viewer.canActivateAR) {
    viewer.activateAR();
  } else {
    noticeText.textContent = 'Simple AR isn\u2019t available on this browser/device. Try opening this page on a phone with Chrome (Android) or Safari (iPhone).';
    notice.hidden = false;
  }
});

// Ignore cart callbacks from a session after another session becomes active.
let arSessionId = 0;

tabs.advancedAr.addEventListener('click', () => {
  setActiveTab('advancedAr');
  notice.hidden = true;

  if (!window.AdvancedAR) {
    noticeText.textContent = 'Advanced AR is still loading \u2014 give it a second and tap again.';
    notice.hidden = false;
    return;
  }

  viewer.hidden = true;
  xrCanvas.hidden = false;

  const sessionId = ++arSessionId;
  window.AdvancedAR.start({
    modelUrl: product && product.model_url ? product.model_url : PLACEHOLDER_GLB,
    onExit: () => {
      xrCanvas.hidden = true;
      viewer.hidden = false;
      setActiveTab('view3d');
    },
    onAddToCart: () => {
      if (sessionId === arSessionId && product) addToCart(product.id);
    },
    onError: (error) => {
      noticeText.textContent = `${error.message} Try Simple AR or use a supported Android browser over HTTPS.`;
      notice.hidden = false;
      setActiveTab('view3d');
    },
  });
});

noticeClose.addEventListener('click', () => {
  notice.hidden = true;
});

// ─── INIT ───
const productId = getProductIdFromUrl();
if (productId) {
  loadProduct(productId);
} else {
  document.getElementById('productName').textContent = 'No product selected';
  document.getElementById('productDesc').textContent = 'Please select a product from the menu.';
}
</script>
</body>
</html>
